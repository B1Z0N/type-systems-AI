# The agents: Sonnet (main), Haiku (section 8) and Codex (section 9).
# Model ids and the CLI version are pinned: a run refuses to start if `<cli> --version` differs.
claude-sonnet:
  model: claude-sonnet-5-5
  cli_version: "2.1.306"
claude-haiku:
  model: claude-haiku-5-5
  cli_version: "2.1.306"
codex:
  cli: codex
  model: gpt-6-sol
  reasoning_effort: medium
  cli_version: "0.162.1"
