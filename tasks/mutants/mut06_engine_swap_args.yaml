prompt: |
  A customer-facing bug was reported. This test reproduces it: added to the test suite
  (it uses the `world` fixture from `tests/conftest.py`), it fails.

  ```python
  from billing import reports


  def test_revenue_between_nets_credit_notes(world):
      cus = world.customer()
      world.engine.subscribe(cus["id"], [(world.monthly["id"], 1)])
      [inv] = world.engine.invoices_for(cus["id"])
      world.engine.refund(inv["id"])
      assert reports.revenue_between(world.ctx, inv["paid_at"], inv["paid_at"] + 1) == {"usd": 0}
  ```

  It fails with:

  ```
  AttributeError: 'str' object has no attribute 'store'
  ```

  The expectations in the test are correct. Find the root cause in the `billing` package and fix it.
