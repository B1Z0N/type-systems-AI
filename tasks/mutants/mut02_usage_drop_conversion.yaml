prompt: |
  A customer-facing bug was reported. This test reproduces it: added to the test suite
  (it uses the `world` fixture from `tests/conftest.py`), it fails.

  ```python


  def test_usage_outside_period_not_billed(world):
      cus = world.customer()
      sub = world.engine.subscribe(cus["id"], [(world.api_calls["id"], 0)])
      start_ms = sub["current_period_start"] * 1000
      world.engine.report_usage(sub["id"], world.api_calls["id"], 7, timestamp=start_ms - 1)
      world.engine.report_usage(sub["id"], world.api_calls["id"], 5, timestamp=start_ms)
      created = world.advance_days(31)
      assert created[0]["lines"][0]["quantity"] == 5
  ```

  It fails with:

  ```
  assert 0 == 5
  ```

  The expectations in the test are correct. Find the root cause in the `billing` package and fix it.
answer_schema: |
  {"file": "<file name inside billing/>", "function": "<function name where the bug was>"}
