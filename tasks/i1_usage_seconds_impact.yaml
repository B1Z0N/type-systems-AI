id: i1_usage_seconds_impact
category: list
stratum: type_relevant
title: Impact of storing usage timestamps in seconds
read_only: true
relevant_files: [usage.py, api.py, engine.py, clock.py, models.py]
prompt: |
  We want to store `timestamp` on usage records in epoch seconds instead of the current unit,
  while the public API and `report_usage` keep accepting the old unit from clients.
  Do not make the change. List every function whose code would have to change.
  Name functions as `module.function` (methods as `module.Class.method`), relative to the
  `billing` package.
answer_schema: |
  {"functions": ["<module.function>", ...]}
grader:
  type: sets
  expected:
    functions:
      required: [usage.report_usage, usage.records_in_period]
      allowed: [api.report_usage, engine.BillingEngine.report_usage, clock.to_seconds, clock.to_millis, usage.aggregate_usage]
